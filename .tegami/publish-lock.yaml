core:changelogs:
  - content: "---\npackages:\n  \"@lenso/service-kit\":\n    type: patch\n---\n\n### Features\n\nPublish the Framework-owned Service authoring kit with Provider V1 delivery,\ntyped Module manifests, signed enrollment, and System Plane integration.\n"
    filename: service-kit.md
    v: 0.0.0
  - content: "---\npackages:\n  lenso-autonomous-service:\n    type: patch\n  lenso-contracts:\n    type: patch\n  lenso-module-management:\n    type: patch\n  lenso-platform-core:\n    type: patch\n  lenso-platform-http:\n    type: patch\n  lenso-platform-module:\n    type: patch\n  lenso-platform-module-management:\n    type: patch\n  lenso-platform-provider:\n    type: patch\n  lenso-platform-runtime:\n    type: patch\n  lenso-platform-runtime-observability:\n    type: patch\n  lenso-platform-runtime-operations:\n    type: patch\n  lenso-platform-system-plane:\n    type: patch\n  lenso-platform-testing:\n    type: patch\n  lenso-service:\n    type: patch\n---\n\n### Features\n\nPublish the current Linked Module, Provider V1, signed Service enrollment, and\nindependent System Plane composition contracts from the completed architecture.\n\n### Breaking changes\n\nRemote Module is not an active loading source. Independently running code is a\nService, and current Modules are Linked into their owning Host.\n"
    filename: current-system-plane-foundation.md
    v: 0.0.0
