[package]
name = "lenso-capability-http-client"
version = "0.3.1"
description = "Portable outbound HTTP Client Capability contract for Lenso Plugins."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso.contract]
descriptor = "capability.json"
projection = "rust"
output = "src/generated.rs"

[dependencies]
futures.workspace = true
lenso-contract-runtime = { version = "0.2.0", path = "../lenso-contract-runtime" }
lenso-kernel = { version = "=0.3.11", path = "../lenso-kernel" }
lenso-plugin-authoring = { version = "0.2.0", path = "../lenso-plugin-authoring" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
lenso-contract-codegen = { version = "=0.9.0", path = "../lenso-contract-codegen" }
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
