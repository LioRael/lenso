[package]
name = "lenso-capability-http-endpoint"
version = "0.3.6"
description = "Portable HTTP Endpoint Capability contract for Lenso backend Plugins."
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.http.endpoint.authoring-tests"
root-slot = "web"

[package.metadata.lenso.contract]
descriptor = "capability.json"
projection = "rust-runtime"
output = "src/generated.rs"

[features]
process = ["dep:lenso-process-sdk"]

[dependencies]
futures.workspace = true
http.workspace = true
lenso-capability-http-endpoint-macros = { path = "../lenso-capability-http-endpoint-macros", version = "0.1.5" }
lenso-contract-authoring.workspace = true
lenso-contract-runtime = { version = "0.2.0", path = "../lenso-contract-runtime" }
lenso-guest-sdk = { version = "0.5.0", path = "../lenso-guest-sdk" }
lenso-kernel = { version = "=0.3.12", path = "../lenso-kernel" }
lenso-plugin-authoring = { version = "0.2.0", path = "../lenso-plugin-authoring" }
lenso-process-sdk = { version = "0.2.0", path = "../lenso-process-sdk", optional = true }
lenso-runtime-codec = { version = "0.4.4", path = "../lenso-runtime-codec" }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
schemars.workspace = true

[dev-dependencies]
lenso.workspace = true

[build-dependencies]
lenso-contract-codegen = { version = "=0.10.1", path = "../lenso-contract-codegen" }
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
