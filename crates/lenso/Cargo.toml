[package]
name = "lenso"
version = "0.5.25"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Rust authoring and Host facade for Lenso applications and Plugins."
readme = "README.md"

[package.metadata.lenso]
plugin-id = "lenso"
root-slot = "test"

[dependencies]
futures.workspace = true
lenso-kernel.workspace = true
lenso-plugin-authoring.workspace = true
lenso-plugin-control-plane = { version = "0.4.24", path = "../lenso-plugin-control-plane", optional = true }
lenso-native-adapter = { version = "0.3.15", path = "../lenso-native-adapter" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = []
host = ["dep:lenso-plugin-control-plane", "dep:tokio", "tokio/io-std"]

[[example]]
name = "control_fixture"
required-features = ["host"]

[dev-dependencies]
lenso-app-plan.workspace = true
lenso-runtime-codec = { path = "../lenso-runtime-codec" }
lenso-test = { version = "0.1.2", path = "../lenso-test" }

[lints]
workspace = true
