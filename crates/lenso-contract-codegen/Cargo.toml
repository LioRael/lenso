[package]
name = "lenso-contract-codegen"
version = "0.10.2"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Generates exact Rust, TypeScript, and WIT bindings from portable Lenso Capability contracts."

[dependencies]
lenso-contract-authoring = { version = "0.1.2", path = "../lenso-contract-authoring" }
regex.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"
wit-parser = "0.252"

[build-dependencies]
sha2.workspace = true

[lints]
workspace = true
