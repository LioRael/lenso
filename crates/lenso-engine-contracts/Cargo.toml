[package]
name = "lenso-engine-contracts"
version = "0.1.0"
publish = true
edition = "2024"
license = "MIT"
description = "Optional configurable Engine support for Capability contract projections"

[dependencies]
lenso-engine = { path = "../lenso-engine", version = "0.2.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lenso-contract-codegen = { path = "../lenso-contract-codegen", version = "0.10.1" }
tempfile = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
tempfile = { workspace = true }
