[package]
name = "lenso-engine-web"
version = "0.1.0"
publish = true
edition = "2024"
license = "MIT"
description = "Optional configurable Engine support for Rust HTTP route authoring"

[dependencies]
lenso-engine = { path = "../lenso-engine", version = "0.2.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
matchit = "0.8.4"

[dev-dependencies]
tempfile = { workspace = true }
