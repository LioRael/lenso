[package]
name = "lenso-capability-configuration-source"
version = "0.1.2"
description = "Portable bootstrap Configuration Source Capability for Lenso Hosts"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso.contract]
descriptor = "capability.json"
projection = "rust-runtime"
output = "src/generated.rs"

[dependencies]
futures.workspace = true
lenso-contract-runtime = { path = "../lenso-contract-runtime", version = "0.2.0" }
lenso-guest-sdk = { path = "../lenso-guest-sdk", version = "0.5.0" }
lenso-kernel = { path = "../lenso-kernel", version = "=0.3.12" }
lenso-plugin-sdk = { path = "../lenso-plugin-sdk", version = "0.4.5" }
lenso-plugin-authoring = { path = "../lenso-plugin-authoring", version = "=0.2.0" }
lenso-runtime-codec = { path = "../lenso-runtime-codec", version = "=0.4.4" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
lenso-contract-codegen = { path = "../lenso-contract-codegen", version = "=0.10.2" }

[lints]
workspace = true
