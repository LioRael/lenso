[package]
name = "lenso-agent-tool-cli-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host-owned CLI ingress for explicitly bound Agent Tool providers"
publish = true

[package.metadata.lenso]
plugin-id = "lenso.agent.tool-cli"
root-slot = "agent-tool-cli"

[dependencies]
lenso = { path = "../lenso", version = "=0.5.27" }
lenso-app-plan = { path = "../lenso-app-plan", version = "=0.4.6" }
lenso-capability-agent-tool-provider = "=0.2.2"
serde_json = "1"

[lints]
workspace = true
