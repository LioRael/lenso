[package]
name = "lenso-bun-adapter"
version = "0.1.14"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Bun process Execution Adapter for Lenso vNext."

[features]
process-test-fixture = ["dep:lenso-process-sdk"]
js-integration = []

[dependencies]
axum.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
hex.workspace = true
jsonrpsee = { version = "0.26", default-features = false, features = ["http-client", "server"] }
lenso-app-plan = { version = "=0.4.5", path = "../lenso-app-plan" }
lenso-kernel = { version = "=0.3.11", path = "../lenso-kernel" }
lenso-process-protocol = { version = "=0.2.3", path = "../lenso-process-protocol" }
lenso-runtime-codec = { version = "=0.4.2", path = "../lenso-runtime-codec" }
lenso-process-sdk = { version = "0.2.0", path = "../lenso-process-sdk", optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiny_http = "0.12"
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds.workspace = true
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
lenso-native-adapter = { version = "=0.3.15", path = "../lenso-native-adapter" }
lenso-plugin-bundle = { version = "=0.5.1", path = "../lenso-plugin-bundle" }
lenso-process-adapter = { version = "=0.3.12", path = "../lenso-process-adapter" }
tempfile = "3"
time.workspace = true

[[bin]]
name = "lenso-bun-rust-process-fixture"
path = "src/bin/rust_process_fixture.rs"
required-features = ["process-test-fixture"]
test = false

[[test]]
name = "authoring_v2"
path = "tests/authoring_v2.rs"
required-features = ["js-integration"]

[[test]]
name = "bun_cross_runtime"
path = "tests/bun_cross_runtime.rs"
required-features = ["js-integration"]

[[test]]
name = "process_v1_bootstrap"
path = "tests/process_v1_bootstrap.rs"
required-features = ["js-integration"]

[lints]
workspace = true
