[package]
name = "lenso-host-runtime"
version = "0.1.9"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Prepared-distribution runtime for TypeScript-authored Lenso Hosts."

[dependencies]
lenso = { version = "=0.5.25", path = "../lenso", features = ["host"] }
lenso-bun-adapter = { version = "=0.1.14", path = "../lenso-bun-adapter" }
lenso-host-distribution = { version = "=0.1.23", path = "../lenso-host-distribution" }
lenso-kernel = { version = "=0.3.11", path = "../lenso-kernel" }
lenso-plugin-control-plane = { version = "=0.4.24", path = "../lenso-plugin-control-plane" }
lenso-process-adapter = { version = "=0.3.12", path = "../lenso-process-adapter" }
lenso-runtime-codec = { version = "=0.4.2", path = "../lenso-runtime-codec" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
lenso-app-plan = { version = "=0.4.5", path = "../lenso-app-plan" }
sha2.workspace = true
tempfile = "3"

[lints]
workspace = true
