[workspace]
resolver = "2"
members = ["host", "fixtures/duplex-endpoint-plugin", "fixtures/http-parity-plugin"]

[workspace.dependencies]
lenso-app-plan = "=0.4.4"
lenso-kernel = "=0.3.10"
lenso-native-adapter = { path = "../../crates/lenso-native-adapter" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

# Runtime implementations come from this checkout. The portable Core and Web
# contracts are exact candidate coordinates in Cargo.lock; local qualification
# patches their source explicitly and does not imply a published cohort.
[patch.crates-io]
lenso = { path = "../../crates/lenso" }
lenso-native-adapter = { path = "../../crates/lenso-native-adapter" }
