[workspace]
resolver = "3"
members = ["crates/lenso-app", "crates/lenso-sqlite", "examples/private-files", "examples/workflows", "examples/team-desk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
