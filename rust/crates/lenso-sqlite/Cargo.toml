[package]
name = "lenso-sqlite"
description = "SQLite durable task and event delivery for Lenso"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/LioRael/lenso"
homepage = "https://github.com/LioRael/lenso"
exclude = ["tests/"]

[dependencies]
lenso-app = { path = "../lenso-app", version = "0.1.0", features = ["json"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
