syntax = "proto3";

package lenso.provider.v1;

// The native binding uses the same canonical JSON envelopes and durable
// invocation identities as the HTTP/JSON Provider V1 binding.
service Provider {
  rpc DescribeProvider(JsonEnvelope) returns (JsonEnvelope);
  rpc CheckHealth(JsonEnvelope) returns (JsonEnvelope);
  rpc InvokeHttpRoute(JsonEnvelope) returns (JsonEnvelope);
  rpc ListAdminRecords(JsonEnvelope) returns (JsonEnvelope);
  rpc GetAdminRecord(JsonEnvelope) returns (JsonEnvelope);
  rpc QueryAdminValue(JsonEnvelope) returns (JsonEnvelope);
  rpc InvokeAdminAction(JsonEnvelope) returns (JsonEnvelope);
  rpc InvokeRuntimeFunction(JsonEnvelope) returns (JsonEnvelope);
  rpc HandleEvent(JsonEnvelope) returns (JsonEnvelope);
  rpc GetInvocation(JsonEnvelope) returns (JsonEnvelope);
  rpc AcknowledgeInvocation(JsonEnvelope) returns (JsonEnvelope);
}

message JsonEnvelope {
  string payload_json = 1;
}
