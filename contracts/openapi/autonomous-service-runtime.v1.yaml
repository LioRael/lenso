    post:
      tags:
      - service-runtime
      operationId: start_workflow
      parameters:
      - name: owner
        in: path
        description: Owning Module identity
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: Stable Workflow Definition name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStartResult'
        '400':
          description: ''
          content:
            application/problem+json:
              schema:
