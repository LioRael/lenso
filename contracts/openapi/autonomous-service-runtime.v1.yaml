      parameters:
      - name: instance_id
        in: path
        description: Stable Workflow Instance identity
        required: true
        schema:
          type: string
      - name: action
        in: path
        description: pause, resume, retry, cancel, terminate, or intervene
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowOperatorPlanRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
