  /system-plane/v1:
    get:
      tags:
      - system-plane
      operationId: discover_core
      responses:
        '200':
          description: Authenticated System Plane Core document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreDocument'
        '401':
          description: Workload Identity or transport binding was not accepted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SystemPlaneErrorBody'
        '403':
          description: Caller is not the enrolled Console Service Principal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SystemPlaneErrorBody'
        '503':
          description: System Plane access is not configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SystemPlaneErrorBody'
      security:
      - bearer_auth: []
