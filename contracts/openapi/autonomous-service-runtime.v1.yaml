components:
  schemas:
    ActionContributionResolution:
      type: object
      required:
      - protocol
      - context
      - slot
      - slotVersion
      - contributions
      properties:
        context:
          $ref: '#/components/schemas/ManagedServiceContext'
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedActionContribution'
        protocol:
          type: string
        slot:
          type: string
        slotVersion:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    ActionContributionResolutionRequest:
      type: object
      required:
      - context
      - slot
      - slotVersion
      properties:
        context:
          $ref: '#/components/schemas/ManagedServiceContext'
        slot:
          type: string
        slotContext:
          type: object
          additionalProperties: {}
          propertyNames:
            type: string
        slotVersion:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    ActiveDegradedMode:
      type: object
      required:
      - dependencyId
      - mode
      - evidenceReferences
      properties:
        dependencyId:
          type: string
        evidenceReferences:
          type: array
          items:
            type: string
        mode:
          type: string
    CapabilityAdvertisement:
      type: object
      required:
      - contractId
      - majorVersion
      - schemaDigest
      - endpoint
      properties:
        contractId:
          type: string
          pattern: ^lenso\.system-plane\.[a-z0-9]+(?:[.-][a-z0-9]+)*\.v[1-9][0-9]*$
        endpoint:
          type: string
          pattern: ^/system-plane/v1/[a-z0-9]+(?:[/-][a-z0-9]+)*$
        featureIds:
          type: array
          items:
            type: string
          uniqueItems: true
        majorVersion:
          type: integer
          format: int32
          minimum: 1
        schemaDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
    ConsoleActionInputBinding:
      type: object
      required:
      - input
      - value
      properties:
        input:
          type: string
        value:
          $ref: '#/components/schemas/ConsoleActionInputValue'
    ConsoleActionInputValue:
      oneOf:
      - type: object
        required:
        - path
        - kind
        properties:
          kind:
            type: string
            enum:
            - slot_context
          path:
            type: string
    ConsoleContributionAction:
      oneOf:
      - type: object
        required:
        - module
        - name
        - kind
        properties:
          input_bindings:
            type: array
            items:
              $ref: '#/components/schemas/ConsoleActionInputBinding'
          kind:
            type: string
            enum:
            - admin_action
          module:
            type: string
          name:
            type: string
    CoreDocument:
      type: object
      required:
      - protocol
      - serviceId
      - servicePrincipal
      - serviceRevision
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityAdvertisement'
        protocol:
          type: string
        serviceId:
          type: string
          minLength: 1
        servicePrincipal:
          type: string
          minLength: 1
        serviceRevision:
          type: string
          minLength: 1
      additionalProperties: false
    EffectiveReliabilityValues:
      type: object
      required:
      - availabilityTargetBasisPoints
      - latencyTargetMs
      - queueBacklogLimit
      - workflowBacklogLimit
      - timerLagLimitMs
      - retryExhaustionLimit
      - compensationPressureLimit
      - errorBudget
      - errorBudgetConsumedLimitBasisPoints
      - readiness
      - liveness
      properties:
        availabilityTargetBasisPoints:
          type: integer
          format: int32
          minimum: 0
        compensationPressureLimit:
          type: integer
          format: int64
          minimum: 0
        errorBudget:
          type: string
        errorBudgetConsumedLimitBasisPoints:
          type: integer
          format: int32
          minimum: 0
        latencyTargetMs:
          type: integer
          format: int64
          minimum: 0
        liveness:
          $ref: '#/components/schemas/ReliabilityLivenessSemantics'
        queueBacklogLimit:
          type: integer
          format: int64
          minimum: 0
        readiness:
          $ref: '#/components/schemas/ReliabilityReadinessSemantics'
        retryExhaustionLimit:
          type: integer
          format: int64
          minimum: 0
        timerLagLimitMs:
          type: integer
          format: int64
          minimum: 0
        workflowBacklogLimit:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      - errors
      properties:
        code:
          type: string
        correlation_id:
          type:
          - string
          - 'null'
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemErrorDetail'
        next_actions:
          type:
          - array
          - 'null'
          items:
            type: string
        request_id:
          type:
          - string
          - 'null'
        status:
          type: integer
          format: int32
          maximum: 599
          minimum: 100
        title:
          type: string
        type:
          type: string
    ManagedServiceContext:
      type: object
      description: |-
        The target and caller identity carried by every Module System Plane request.
        The target Service verifies this against its authenticated transport,
        enrollment grant, and installed Module declarations before executing an
        operation.
      required:
      - systemId
      - serviceId
      - environmentId
      - targetServicePrincipal
      - callerModuleId
      - delegatedActorSubject
      - delegatedAuthorityDigest
      properties:
        callerModuleId:
          type: string
        capabilities:
          type: array
          items:
            type: string
          uniqueItems: true
        delegatedActorSubject:
          type: string
        delegatedAuthorityDigest:
          type: string
        environmentId:
          type: string
        serviceId:
          type: string
        systemId:
          type: string
        targetServicePrincipal:
          type: string
      additionalProperties: false
    ManagementActor:
      type: object
      required:
      - kind
      - subject
      - delegatedAuthorityDigest
      properties:
        delegatedAuthorityDigest:
          type: string
        kind:
          $ref: '#/components/schemas/ManagementActorKind'
        subject:
          type: string
      additionalProperties: false
