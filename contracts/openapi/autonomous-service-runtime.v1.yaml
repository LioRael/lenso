        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Runtime observation changes or an explicit Evidence Gap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeObservationFeed'
        '401':
          description: Workload Identity or transport binding was not accepted
          content:
            application/problem+json:
