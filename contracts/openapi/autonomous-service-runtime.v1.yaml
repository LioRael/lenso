        actor:
          $ref: '#/components/schemas/ManagementActor'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ManagementApproval'
        capabilityContractId:
          type: string
        capabilitySchemaDigest:
          type: string
        deadlineUnixMs:
