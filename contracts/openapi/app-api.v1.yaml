            schema:
              $ref: '#/components/schemas/PhoneOtpVerifyRequest'
        required: true
      responses:
        '200':
          description: Phone OTP verification successful
          headers:
            set-cookie:
              schema:
                type: string
              description: HTTP-only session cookie
            x-correlation-id:
              schema:
                type: string
              description: Correlation identifier shared across related work
            x-request-id:
              schema:
                type: string
              description: Request identifier for this HTTP request
