openapi: 3.1.0
info:
  title: Lenso API
  description: Rust-first modular monolith API contract
  license:
    name: MIT
    identifier: MIT
  version: 1.0.0
paths:
  /.well-known/jwks.json:
    get:
      tags:
      - auth
      operationId: auth_oidc_jwks
      responses:
        '200':
          description: OIDC JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcJwksResponse'
        '404':
          description: OIDC provider is not enabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Invalid OIDC provider configuration
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /.well-known/openid-configuration:
    get:
      tags:
      - auth
      operationId: auth_oidc_provider_metadata
      responses:
        '200':
          description: OIDC provider metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderMetadataResponse'
        '404':
          description: OIDC provider is not enabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Invalid OIDC provider configuration
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /modules/{module}/http/{*path}:
    get:
      tags:
      - modules
      operationId: service_module_http_proxy_get
      parameters:
      - name: module
        in: path
        description: Configured Service-provided Module name
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: Module-local HTTP path matched against the Service-provided manifest
        required: true
        schema:
          type: string
      - name: authorization
        in: header
        description: Development service bearer token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Provider route forwarded through the host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHttpProxyResponse'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service/system authentication or declared capability is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No configured Service-provided route matched
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider export request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - modules
      operationId: service_module_http_proxy_put
      parameters:
      - name: module
        in: path
        description: Configured Service-provided Module name
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: Module-local HTTP path matched against the Service-provided manifest
        required: true
        schema:
          type: string
      - name: authorization
        in: header
        description: Development service bearer token
        required: true
        schema:
          type: string
      requestBody:
        description: JSON request body forwarded to the matched Service-provided Module route
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Provider route forwarded through the host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHttpProxyResponse'
        '400':
          description: Request body policy rejected the request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service/system authentication or declared capability is required
          content:
            application/problem+json:
