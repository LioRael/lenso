              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service/system authentication or declared capability is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No configured Service-provided route matched
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider export request failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /oauth/authorize:
    get:
      tags:
      - auth
      operationId: auth_oidc_authorize
      parameters:
      - name: response_type
        in: query
        description: Must be `code`
        required: true
        schema:
          type: string
      - name: client_id
        in: query
        description: Registered OIDC client id
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        description: Registered redirect URI
        required: true
        schema:
          type: string
      - name: scope
        in: query
        description: Space-separated scopes including `openid`
        required: true
        schema:
          type: string
      - name: state
        in: query
        description: Opaque client state echoed to the redirect URI
        required: false
        schema:
          type: string
      - name: nonce
        in: query
        description: Opaque nonce stored with the authorization code
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        description: PKCE S256 code challenge
        required: true
        schema:
          type: string
      - name: code_challenge_method
        in: query
        description: Must be `S256`
        required: true
        schema:
          type: string
      responses:
        '303':
          description: Redirects to the registered redirect URI with an authorization code
        '400':
          description: Request validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /oauth/token:
    post:
      tags:
      - auth
      operationId: auth_oidc_token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OidcTokenRequest'
        required: true
      responses:
        '200':
          description: OIDC token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcTokenResponse'
        '400':
          description: Request validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid authorization grant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/anonymous/login:
    post:
      tags:
      - auth
      operationId: auth_anonymous_login
      parameters:
      - name: x-request-id
        in: header
        description: Optional caller-provided request identifier
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: x-correlation-id
        in: header
        description: Optional caller-provided correlation identifier
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        description: Create an anonymous auth session
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnonymousSignInRequest'
        required: true
      responses:
        '200':
          description: Anonymous session created
          headers:
            x-correlation-id:
              schema:
                type: string
              description: Correlation identifier shared across related work
            x-request-id:
              schema:
                type: string
              description: Request identifier for this HTTP request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousSessionResponse'
        '400':
