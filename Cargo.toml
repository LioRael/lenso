[workspace]
resolver = "2"
members = [
    "crates/lenso-app-plan",
    "crates/lenso-authoring",
    "crates/lenso-bun-adapter",
    "crates/lenso-contract-codegen",
    "crates/lenso-capability-greeting",
    "crates/lenso-capability-secure-greeting",
    "crates/lenso-capability-auth",
    "crates/lenso-capability-game-session",
    "crates/lenso-capability-secrets",
    "crates/lenso-capability-counter",
    "crates/lenso-capability-story-events",
    "crates/lenso-capability-story-query",
    "crates/lenso-capability-agent-model",
    "crates/lenso-capability-agent-tool",
    "crates/lenso-capability-agent-memory",
    "crates/lenso-capability-agent-progress",
    "crates/lenso-capability-agent",
    "crates/lenso-auth-sdk",
    "crates/lenso-browser-driver",
    "crates/lenso-kernel",
    "crates/lenso-native-adapter",
    "crates/lenso-runner",
    "crates/lenso-wasip2-driver",
    "crates/lenso-otel-module",
    "fixtures/portable-contract/rust",
    "fixtures/vnext-native-greeter",
    "fixtures/vnext-game-session",
    "fixtures/vnext-stateful-module",
    "fixtures/vnext-story-module",
    "fixtures/vnext-agent-harness",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt", "time"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
