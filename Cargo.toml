[workspace]
resolver = "2"
members = [
    "crates/lenso-app-plan",
    "crates/lenso-bun-adapter",
    "crates/lenso-contract-codegen",
    "crates/lenso-capability-greeting",
    "crates/lenso-capability-auth",
    "crates/lenso-browser-driver",
    "crates/lenso-kernel",
    "crates/lenso-native-adapter",
    "crates/lenso-runner",
    "crates/lenso-wasip2-driver",
    "fixtures/portable-contract/rust",
    "fixtures/vnext-native-greeter",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tokio = { version = "1.52", features = ["macros", "rt", "time"] }
base64 = "0.22"
ring = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
