[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22"
futures = "0.3"
hex = "0.4"
inventory = "0.3"
lenso-app-plan = { path = "crates/lenso-app-plan", version = "=0.4.5" }
lenso-kernel = { path = "crates/lenso-kernel", version = "=0.3.11" }
lenso-plugin-authoring = "0.2.0"
lenso-runtime-conformance = { path = "crates/lenso-runtime-conformance", version = "=0.3.10" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "http2", "json", "rustls"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
