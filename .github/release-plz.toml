[workspace]
# The dispatch-only release gate is the publication boundary. It verifies an
# exact landed SHA, candidate CI evidence, and the complete registry-derived
# package/version set before release-plz can receive publishing credentials.
# Packages must also opt in through `publish = true` in their manifest.
# crates.io Trusted Publishing cannot create a package. Bootstrap a new crate
# only after its release source passes `cargo publish --dry-run`; all later
# versions remain behind the explicit publish dispatch boundary.
release_always = true
changelog_update = false
git_tag_name = "{{ package }}-v{{ version }}"
