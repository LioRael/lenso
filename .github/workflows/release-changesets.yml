name: Changesets

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: Run the packaging inspection jobs (never publishes)
        required: true
        type: boolean
        default: true
  # Deliberately no push trigger: this workflow does not publish.

permissions: {}

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm_build == true }}
    name: Build ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: darwin-arm64
            os: macos-14
            rust-target: ""
            smoke: true
          - tag: darwin-x64
            os: macos-14
            rust-target: x86_64-apple-darwin
            smoke: false
          - tag: linux-x64
            os: ubuntu-24.04
            rust-target: ""
            smoke: true
          - tag: win32-x64
            os: windows-2025
            rust-target: ""
            smoke: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: 24.18.0
      - name: Set up pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install npm workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Add Rust target
        if: matrix.rust-target != ''
        run: rustup target add "${{ matrix.rust-target }}"
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check npm shim
        run: npm run check:npm-shim
      - name: Build npm distribution binary
        env:
          LENSO_NPM_TAG: ${{ matrix.tag }}
          LENSO_CARGO_TARGET: ${{ matrix.rust-target }}
        run: npm run package:npm
      - name: Check target artifact
        run: |
          if [[ "${{ matrix.tag }}" == win32-* ]]; then
            test -f "vendor/${{ matrix.tag }}/lenso.exe"
          else
            test -x "vendor/${{ matrix.tag }}/lenso"
          fi
      - name: Smoke bundled binary
        if: matrix.smoke
        run: |
          node bin/lenso.js --version
          node bin/lenso.js plugins add --help
          node bin/lenso.js plugins remove --help
      - name: Upload npm distribution binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lenso-cli-${{ matrix.tag }}
          path: vendor
          if-no-files-found: error
