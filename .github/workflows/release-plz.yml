name: Release-plz

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the landed source commit to verify and release
        required: true
        type: string
      release_set:
        description: JSON array of exact package_name/version objects
        required: true
        default: '[]'
        type: string
      mode:
        description: Read-only by default; publish requires separate authorization
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      publish_confirmation:
        description: Enter publish only when mode is publish
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  release_gate:
    name: Verify landed release source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_REPOSITORY: LioRael/lenso-runtime-rust
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.publish_confirmation }}
    steps:
      - name: Checkout landed release guard
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Verify source, package set, and exact CI evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-gate.sh

  release_plan:
    name: Verify exact cohort artifacts
    needs: release_gate
    if: ${{ needs.release_gate.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: release-plz-plan-${{ inputs.source_sha }}
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      EXPECTED_RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.publish_confirmation }}
    steps:
      - name: Checkout landed release guard
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify guard checkout identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA,,}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Package and compile exact cohort artifacts
        run: bash .github/scripts/release-cohort-preflight.sh

  release:
    name: Publish exact crate cohort
    needs: [release_gate, release_plan]
    if: >-
      ${{ inputs.mode == 'publish' &&
          needs.release_gate.result == 'success' &&
          needs.release_plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-plz-release-${{ inputs.source_sha }}
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      EXPECTED_RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.publish_confirmation }}
    steps:
      - name: Checkout landed release guard
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify guard checkout identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA,,}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish approved cohort through crates.io OIDC
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: bash .github/scripts/release-cohort-publish.sh
