name: Release-plz

on:
  workflow_dispatch:

# This rollout deliberately provides inspection only. Publication and release PR
# creation require a separately authorized maintainer change.
permissions: {}

jobs:
  release-plz-dry-run:
    name: Release-plz dry run
    if: ${{ github.repository_owner == 'LioRael' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Inspect pending releases
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          dry_run: true
