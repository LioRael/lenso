name: Release-plz

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA of the landed source commit to verify and release
        required: true
        type: string
      release_set:
        description: JSON array of exact package_name/version objects
        required: true
        default: '[]'
        type: string
      mode:
        description: Read-only by default; publish requires separate authorization
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions: {}

jobs:
  release_gate:
    name: Verify landed release source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_SET: ${{ inputs.release_set }}
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Verify source, package set, and exact CI evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-gate.sh

  release_plan:
    name: Verify exact cohort artifacts
    needs: release_gate
    if: ${{ needs.release_gate.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: release-plz-plan-${{ inputs.source_sha }}
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      EXPECTED_RELEASE_SET: ${{ inputs.release_set }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Package and compile exact cohort artifacts
        run: bash .github/scripts/release-cohort-preflight.sh

  release:
    name: Release-plz release
    needs: [release_gate, release_plan]
    if: >-
      ${{ inputs.mode == 'publish' &&
          needs.release_gate.result == 'success' &&
          needs.release_plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Prepare release-plz branch identity
        run: |
          git fetch origin main --no-tags
          git switch --force-create main "${RELEASE_SHA,,}"
          git branch --set-upstream-to=origin/main main
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA,,}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 1.94.0
        with:
          toolchain: 1.94.0
      - name: Publish approved release set
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          config: .github/release-plz.toml
          version: 0.3.160
