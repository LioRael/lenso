name: Release verified archives
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Explicit comma-separated public package names"
        required: true
        type: string
      registry:
        description: "Approved registry (or repository RELEASE_REGISTRY variable)"
        type: string
      access:
        description: "Approved public/restricted access (or RELEASE_ACCESS variable)"
        type: string
      tag:
        description: "Approved dist-tag (or RELEASE_TAG variable)"
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
env:
  RELEASE_REGISTRY: ${{ inputs.registry || vars.RELEASE_REGISTRY }}
  RELEASE_ACCESS: ${{ inputs.access || vars.RELEASE_ACCESS }}
  RELEASE_TAG: ${{ inputs.tag || vars.RELEASE_TAG }}
  RELEASE_PACKAGES: ${{ inputs.packages }}
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.archives.outputs.artifact }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile
      - name: PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: bash scripts/ci-checks.sh
      - id: archives
        run: bun scripts/release-ci.ts prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.archives.outputs.artifact }}
          path: ${{ steps.archives.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PROTECTED_JOB: npm-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/release.npmrc"
          printf '\n' > "$NPM_CONFIG_USERCONFIG"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          npm install --global npm@12.2.0 --ignore-scripts
          test "$(npm --version)" = 12.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/verified-release
      - name: Publish only the verified archives
        run: bun scripts/release-ci.ts publish "$RUNNER_TEMP/verified-release/release.json"
