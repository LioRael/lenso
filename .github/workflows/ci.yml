name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test the workspace
        run: cargo test --locked --workspace
      - name: Compile the portable Kernel for WebAssembly hosts
        run: |
          cargo check --locked -p lenso-app-plan -p lenso-kernel --target wasm32-unknown-unknown
          cargo check --locked -p lenso-app-plan -p lenso-kernel --target wasm32-wasip2
          cargo check --locked -p lenso-browser-driver --all-targets --target wasm32-unknown-unknown
          cargo check --locked -p lenso-wasip2-driver --all-targets --target wasm32-wasip2
      - name: Run the native skeleton
        run: cargo run --locked -p lenso-runner

  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
          install-dependencies: true
      - name: Install the wasm-bindgen test runner
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Run the browser host smoke
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked -p lenso-browser-driver --target wasm32-unknown-unknown --test smoke
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 47.0.3
      - name: Run the WASIp2 host smoke
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
        run: cargo test --locked -p lenso-wasip2-driver --target wasm32-wasip2 --test smoke
