name: CI

on:
  push:
    branches:
      - 'candidate/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          # Seed via workflow_dispatch on main; sibling candidates cannot share caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test release cohort packaging
        run: bash .github/scripts/test-release-cohort-preflight.sh
      - name: Lint the workspace
        run: cargo clippy --locked --workspace --all-targets --timings -- -D warnings
      - name: Compile workspace tests
        run: cargo test --locked --workspace --no-run --timings
      - name: Test the workspace
        run: cargo test --locked --workspace
      - name: Compile portable core and Workers HTTP Host for WebAssembly
        run: |
          cargo check --locked --timings -p lenso-app-plan -p lenso-kernel -p lenso-runtime-conformance --target wasm32-unknown-unknown
          cargo check --locked --timings -p lenso-workers-http-parity-host --target wasm32-unknown-unknown
          cargo check --locked --timings -p lenso-http-egress-plugin --no-default-features --features workers --target wasm32-unknown-unknown
          cargo check --locked --timings -p lenso-app-plan -p lenso-kernel -p lenso-runtime-conformance --target wasm32-wasip2
      - name: Upload Cargo timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ github.job }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  bun-conformance:
    runs-on: ubuntu-24.04
    env:
      LENSO_JS_ROOT: ${{ github.workspace }}/lenso-js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: lenso
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: LioRael/lenso-js
          ref: a39641e26ad9b629619b55b18bbff591c6e875d6
          path: lenso-js
          persist-credentials: false
      - name: Verify JavaScript fixture revision
        run: test "$(git -C lenso-js rev-parse HEAD)" = a39641e26ad9b629619b55b18bbff591c6e875d6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: lenso
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build JavaScript fixtures
        working-directory: lenso-js
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Test Rust and Bun protocol conformance
        run: >-
          cargo test --locked --manifest-path lenso/Cargo.toml
          -p lenso-bun-adapter --features js-integration
          --test authoring_v2 --test bun_cross_runtime --test process_v1_bootstrap
          -- --include-ignored --test-threads=1
