name: CI

on:
  push:
    branches:
      - 'candidate/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint the workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test the workspace
        run: cargo test --locked --workspace
      - name: Compile portable core for WebAssembly hosts
        run: |
          cargo check --locked -p lenso-app-plan -p lenso-kernel -p lenso-runtime-conformance --target wasm32-unknown-unknown
          cargo check --locked -p lenso-app-plan -p lenso-kernel -p lenso-runtime-conformance --target wasm32-wasip2

  workers-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Check Workers npm helpers
        run: |
          npm test --prefix crates/lenso-http-egress-plugin/js
          npm pack --dry-run ./crates/lenso-http-egress-plugin/js
          npm install --prefix crates/lenso-web-ingress-plugin/js --ignore-scripts --package-lock=false
          npm test --prefix crates/lenso-web-ingress-plugin/js
          npm pack --dry-run ./crates/lenso-web-ingress-plugin/js
