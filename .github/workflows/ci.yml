name: CI

on:
  push:
    branches:
      - 'candidate/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LENSO_WASM_FIXTURE_CACHE_DIR: ${{ github.workspace }}/.lenso/ci-wasm-fixtures
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          # Seed via workflow_dispatch on main; sibling candidates cannot share caches.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check prepared inputs and fast gates
        run: bash .github/scripts/check.sh preflight
      - name: Restore Wasm fixture builds
        id: wasm-fixtures
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LENSO_WASM_FIXTURE_CACHE_DIR }}
          key: wasm-fixtures-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/lenso-wasm-component-adapter/tests/fixtures/**/Cargo.toml', 'crates/lenso-wasm-component-adapter/tests/fixtures/**/Cargo.lock', 'crates/lenso-http-egress-plugin/tests/fixtures/**/Cargo.toml', 'crates/lenso-http-egress-plugin/tests/fixtures/**/Cargo.lock', 'tests/fixtures/portable-http-endpoint/guest/Cargo.toml', 'tests/fixtures/portable-http-endpoint/guest/Cargo.lock') }}
          restore-keys: |
            wasm-fixtures-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Run shared native gates
        run: bash .github/scripts/check.sh native
      - name: Compile portable core and Workers HTTP Host for WebAssembly
        run: bash .github/scripts/check.sh wasm
      - name: Save Wasm fixture builds on main
        if: ${{ github.ref == 'refs/heads/main' && steps.wasm-fixtures.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LENSO_WASM_FIXTURE_CACHE_DIR }}
          key: ${{ steps.wasm-fixtures.outputs.cache-primary-key }}
      - name: Upload Cargo timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ github.job }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  bun-conformance:
    runs-on: ubuntu-24.04
    env:
      LENSO_JS_ROOT: ${{ github.workspace }}/lenso-js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: lenso
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: LioRael/lenso-js
          ref: 18e3cfb2837c8dfe5d5b907e39fe95ae15dc0a65
          path: lenso-js
          persist-credentials: false
      - name: Verify JavaScript fixture revision
        run: test "$(git -C lenso-js rev-parse HEAD)" = 18e3cfb2837c8dfe5d5b907e39fe95ae15dc0a65
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.94.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: lenso
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run shared Bun conformance gates
        working-directory: lenso
        run: bash .github/scripts/check.sh bun
