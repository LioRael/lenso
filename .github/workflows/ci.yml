name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust module sizes
        run: cargo xtask check-rust-module-size
      - name: Check core repository boundary
        run: cargo xtask check-core-repository-boundary
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test the workspace
        run: cargo test --locked --workspace
      - name: Compile portable core for WebAssembly hosts
        run: |
          cargo check --locked -p lenso-app-plan -p lenso-kernel -p lenso-runtime-conformance --target wasm32-unknown-unknown
          cargo check --locked -p lenso-app-plan -p lenso-kernel -p lenso-runtime-conformance --target wasm32-wasip2
