name: Publish reviewed release
run-name: lenso-publish-requested:${{ inputs.event_id }}
on:
  workflow_dispatch:
    inputs:
      event_id: { required: true, type: string }
      plan_id: { required: true, type: string }
      plan_sha256: { required: true, type: string }
      release_commit: { required: true, type: string }
      packages_json: { required: true, type: string }
      nonce: { required: true, type: string }
      recover_consumed_proof: { required: true, default: false, type: boolean }
permissions: {}
concurrency:
  group: lenso-publish-${{ inputs.plan_id }}
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ !inputs.recover_consumed_proof }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b
        id: app
        with:
          app-id: ${{ vars.LENSO_RELEASE_APP_ID }}
          private-key: ${{ secrets.LENSO_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            lenso-release
          permission-contents: write
          permission-metadata: read
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce reviewed release mode and shadow endpoints
        env:
          REQUESTED_MODE: ${{ vars.LENSO_RELEASE_MODE }}
          LENSO_SHADOW_NPM_REGISTRY_URL: ${{ vars.LENSO_SHADOW_NPM_REGISTRY_URL }}
          LENSO_SHADOW_CRATES_API_URL: ${{ vars.LENSO_SHADOW_CRATES_API_URL }}
          LENSO_SHADOW_CRATES_UPLOAD_URL: ${{ vars.LENSO_SHADOW_CRATES_UPLOAD_URL }}
          LENSO_SHADOW_GITHUB_API_URL: ${{ vars.LENSO_SHADOW_GITHUB_API_URL }}
          LENSO_SHADOW_ATTESTATION_URL: ${{ vars.LENSO_SHADOW_ATTESTATION_URL }}
        run: node scripts/release-mode.mjs >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install reviewed publishing toolchains
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm install --global npm@11.7.0
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Build exact release artifacts when configured
        run: pnpm run --if-present build
      - name: Complete fail-closed preflight before any registry OIDC
        env:
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_PLAN_ID: ${{ inputs.plan_id }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_PACKAGES_JSON: ${{ inputs.packages_json }}
          INPUT_NONCE: ${{ inputs.nonce }}
          LENSO_APP_TOKEN: ${{ steps.app.outputs.token }}
          LENSO_COORDINATOR_PREFLIGHT_URL: ${{ vars.LENSO_COORDINATOR_PREFLIGHT_URL }}
          RUNNER_IMAGE: ubuntu-24.04
        run: node .lenso-release/runtime/lib/repository/cli.js preflight
      - name: Atomically consume proof and seal exact registry artifacts
        env:
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_PLAN_ID: ${{ inputs.plan_id }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_PACKAGES_JSON: ${{ inputs.packages_json }}
          INPUT_NONCE: ${{ inputs.nonce }}
          LENSO_APP_TOKEN: ${{ steps.app.outputs.token }}
          LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL: ${{ vars.LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL }}
          LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY: ${{ vars.LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY }}
          RUNNER_IMAGE: ubuntu-24.04
        run: node .lenso-release/runtime/lib/repository/cli.js consume-preflight
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        if: env.LENSO_RELEASE_MODE == 'production' && contains(inputs.packages_json, 'cargo:')
        id: crates-auth
      - name: Publish and confirm receipts
        env:
          INPUT_EVENT_ID: ${{ inputs.event_id }}
          INPUT_PLAN_ID: ${{ inputs.plan_id }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_PACKAGES_JSON: ${{ inputs.packages_json }}
          INPUT_NONCE: ${{ inputs.nonce }}
          LENSO_APP_ID: ${{ vars.LENSO_RELEASE_APP_ID }}
          LENSO_APP_TOKEN: ${{ steps.app.outputs.token }}
          LENSO_ATTESTATION_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ env.LENSO_RELEASE_MODE == 'shadow' && secrets.LENSO_SHADOW_CARGO_TOKEN || steps.crates-auth.outputs.token }}
          NODE_AUTH_TOKEN: ${{ env.LENSO_RELEASE_MODE == 'shadow' && secrets.LENSO_SHADOW_NPM_TOKEN || '' }}
          LENSO_COORDINATOR_RECEIPT_URL: ${{ vars.LENSO_COORDINATOR_RECEIPT_URL }}
          LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL: ${{ vars.LENSO_COORDINATOR_PREFLIGHT_CONSUME_URL }}
          LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY: ${{ vars.LENSO_PREFLIGHT_AUTHORITY_PUBLIC_KEY }}
          RUNNER_IMAGE: ubuntu-24.04
        run: node .lenso-release/runtime/lib/repository/cli.js publish

  recover:
    if: ${{ inputs.recover_consumed_proof }}
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed recovery
        env:
          EXPECTED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          PACKAGES_JSON: ${{ inputs.packages_json }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_COMMIT"
          node <<'NODE'
          const actual = JSON.parse(process.env.PACKAGES_JSON);
          const expected = [
            ["cargo:lenso-autonomous-service", "0.1.11"],
            ["cargo:lenso-contracts", "0.3.16"],
            ["cargo:lenso-platform-core", "0.1.16"],
            ["cargo:lenso-platform-http", "0.1.15"],
            ["cargo:lenso-platform-module", "0.1.16"],
            ["cargo:lenso-platform-module-remote", "0.1.16"],
            ["cargo:lenso-platform-runtime", "0.1.13"],
            ["cargo:lenso-platform-testing", "0.1.12"],
            ["cargo:lenso-service", "0.1.15"],
            ["cargo:lenso-module-story", "0.1.18"],
            ["cargo:lenso", "0.3.33"],
            ["cargo:lenso-api", "0.1.27"],
            ["cargo:lenso-bootstrap", "0.1.26"],
            ["cargo:lenso-migrate", "0.1.25"],
            ["cargo:lenso-platform-admin", "0.1.16"],
            ["cargo:lenso-platform-admin-data", "0.1.21"],
            ["cargo:lenso-worker", "0.1.25"],
          ];
          const normalized = actual.map(({ id, version }) => [id, version]).sort();
          if (JSON.stringify(normalized) !== JSON.stringify(expected.sort())) process.exit(1);
          NODE
      - name: Install reviewed Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: crates-auth
      - name: Publish exact reviewed crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          if ! curl -A lenso-release-publish -fsS \
            https://crates.io/api/v1/crates/lenso-autonomous-service/0.1.11 \
            >/dev/null 2>&1; then
            cargo publish --dry-run --locked -p lenso-autonomous-service --allow-dirty
            cargo publish --locked -p lenso-autonomous-service --allow-dirty
            for attempt in {1..12}; do
              curl -A lenso-release-publish -fsS \
                https://crates.io/api/v1/crates/lenso-autonomous-service/0.1.11 \
                >/dev/null && break
              test "$attempt" -lt 12
              sleep 10
            done
          fi
          sh scripts/publish-crates.sh
      - name: Download exact public registry artifacts for attestation
        env:
          PACKAGES_JSON: ${{ inputs.packages_json }}
        run: |
          mkdir -p target/recovery-attestations
          node <<'NODE' > target/recovery-attestations/packages.tsv
          const packages = JSON.parse(process.env.PACKAGES_JSON);
          const publicArtifacts = new Map(
            packages.map(({ id, version }) => [id.slice("cargo:".length), version]),
          );
          publicArtifacts.set("lenso-autonomous-service", "0.1.10");
          publicArtifacts.set("lenso-service", "0.1.14");
          for (const [name, version] of [...publicArtifacts].sort()) {
            process.stdout.write(`${name}\t${version}\n`);
          }
          NODE
          while IFS=$'\t' read -r package version; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --connect-timeout 10 --max-time 120 \
              --user-agent lenso-release-publish \
              "https://crates.io/api/v1/crates/$package/$version/download" \
              --output "target/recovery-attestations/$package-$version.crate"
          done < target/recovery-attestations/packages.tsv
          cp contracts/ga/lenso.ga-support-manifest.v1.json \
            target/recovery-attestations/lenso.ga-support-manifest.v1.json
          rm target/recovery-attestations/packages.tsv
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: target/recovery-attestations/*
