name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Select checks
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/ci-docs.ts select
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.route != 'light'
        with:
          node-version: 24.21.0
      - run: bun install --frozen-lockfile
      - name: Docs routing regression tests
        run: bun test scripts/ci-docs.test.ts
      - name: Documentation checks
        if: steps.scope.outputs.route == 'light'
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/ci-docs.ts check
      - name: Integration service binaries
        if: steps.scope.outputs.route != 'light'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 redis-server
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: bash scripts/ci-checks.sh
        if: steps.scope.outputs.route != 'light'
