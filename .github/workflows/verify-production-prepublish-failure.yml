name: Verify production prepublish failure
run-name: verify-production-prepublish-failure:${{ inputs.plan_id }}:${{ inputs.failed_run_id }}

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: Exact reviewed plan ID
        required: true
        type: string
      release_commit:
        description: Exact reviewed release commit
        required: true
        type: string
      event_id:
        description: Exact coordinator publisher event ID
        required: true
        type: string
      failed_run_id:
        description: Exact failed publisher run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-production-prepublish-failure-${{ inputs.plan_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed release commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - name: Verify failed publisher stopped before preflight and registry access
        env:
          EVENT_ID: ${{ inputs.event_id }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          GH_TOKEN: ${{ github.token }}
          PLAN_ID: ${{ inputs.plan_id }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(jq -r .planId .lenso-release/plan.json)" = "$PLAN_ID"
          jq -e '
            .packages | length == 14 and
            all(.id | startswith("cargo:"))
          ' .lenso-release/plan.json

          run_json="$(mktemp)"
          jobs_json="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" > "$run_json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs" > "$jobs_json"
          jq -e \
            --arg commit "$RELEASE_COMMIT" \
            --arg event_id "$EVENT_ID" \
            --arg plan_id "$PLAN_ID" '
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "failure" and
              .head_sha == $commit and
              .head_branch == ("release-execution/" + ($plan_id | sub("^sha256:"; ""))) and
              .path == ".github/workflows/publish.yml" and
              .display_title == ("lenso-publish-requested:" + $event_id)
            ' "$run_json"
          jq -e '
            [.jobs[] | select(.name == "publish")] as $publish |
            ($publish | length == 1) and
            ($publish[0].conclusion == "failure") and
            ($publish[0].steps | any(
              .name == "Enforce reviewed release mode and shadow endpoints" and
              .conclusion == "failure"
            )) and
            ($publish[0].steps | any(
              .name == "Complete fail-closed preflight before any registry OIDC" and
              .conclusion == "skipped"
            )) and
            ($publish[0].steps | any(
              .name == "Run rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18" and
              .conclusion == "skipped"
            )) and
            ($publish[0].steps | any(
              .name == "Publish and confirm receipts" and
              .conclusion == "skipped"
            ))
          ' "$jobs_json"

          jq -r '.packages[] | [(.id | sub("^cargo:"; "")), .nextVersion] | @tsv' \
            .lenso-release/plan.json |
          while IFS=$'\t' read -r package version; do
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --user-agent 'lenso-release-prepublish-verifier/1.0 (https://github.com/LioRael/lenso)' \
              "https://crates.io/api/v1/crates/${package}/${version}")"
            test "$status" = 404
          done
      - name: Prove the production npm version is absent
        run: jq -e '[.packages[] | select(.id | startswith("npm:"))] | length == 0' .lenso-release/plan.json
      - name: Prove the production OCI manifest is absent
        run: jq -e '[.packages[] | select(.id | startswith("oci:"))] | length == 0' .lenso-release/plan.json
