name: Release Workers npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Reviewed package directory
        required: true
        type: choice
        options:
          - crates/lenso-http-egress-plugin/js
          - crates/lenso-web-ingress-plugin/js
      version:
        description: Exact reviewed package version
        required: true
        type: string
      source_sha:
        description: Full SHA of the landed source commit to verify and release
        required: true
        type: string
      mode:
        description: Read-only by default; publish requires separate authorization
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      publish_confirmation:
        description: Enter publish only when mode is publish
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: workers-npm-${{ inputs.package }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_PATH: ${{ inputs.package }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_CONFIRMATION: ${{ inputs.publish_confirmation }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Verify exact version and landed source
        run: |
          test "$RELEASE_MODE" = dry-run || test "$RELEASE_MODE" = publish
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$RELEASE_MODE" == publish ]]; then
            test "$RELEASE_CONFIRMATION" = publish
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync(process.env.PACKAGE_PATH + "/package.json")); if (p.version !== process.env.RELEASE_VERSION || p.private) process.exit(1);'
      - name: Install test dependencies
        run: npm install --prefix "$PACKAGE_PATH" --ignore-scripts --package-lock=false
      - name: Test package
        run: npm test --prefix "$PACKAGE_PATH"
      - name: Pack reviewed artifact
        run: |
          mkdir release-artifacts
          npm pack "./$PACKAGE_PATH" --pack-destination release-artifacts
          sha256sum release-artifacts/*.tgz
      - name: Verify npm artifact resolution
        run: npm publish ./release-artifacts/*.tgz --dry-run --access public --provenance=false
      - name: Publish verified artifact
        if: ${{ inputs.mode == 'publish' && inputs.publish_confirmation == 'publish' }}
        run: npm publish ./release-artifacts/*.tgz --access public --provenance
