name: Release Workers npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Reviewed package directory
        required: true
        type: choice
        options:
          - crates/lenso-http-egress-plugin/js
          - crates/lenso-web-ingress-plugin/js
      version:
        description: Exact reviewed package version
        required: true
        type: string
      source_sha:
        description: Full SHA of the landed source commit
        required: true
        type: string
      publish:
        description: Publish using the configured npm Trusted Publisher
        type: boolean
        default: false

permissions: {}

concurrency:
  group: workers-npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      PACKAGE_PATH: ${{ inputs.package }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Verify exact version and landed source
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync(process.env.PACKAGE_PATH + "/package.json")); if (p.version !== process.env.RELEASE_VERSION || p.private) process.exit(1);'
      - name: Install test dependencies without lifecycle scripts
        run: npm install --prefix "$PACKAGE_PATH" --ignore-scripts --package-lock=false
      - name: Test and pack reviewed artifact
        id: pack
        run: |
          npm test --prefix "$PACKAGE_PATH"
          git diff --exit-code -- "$PACKAGE_PATH"
          mkdir release-artifacts
          npm pack "./$PACKAGE_PATH" --pack-destination release-artifacts
          shopt -s nullglob
          archives=(release-artifacts/*.tgz)
          test "${#archives[@]}" -eq 1
          sha256sum "${archives[0]}"
          echo "sha256=$(sha256sum "${archives[0]}" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Verify npm artifact resolution
        run: npm publish ./release-artifacts/*.tgz --dry-run --access public --provenance=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workers-npm-package
          path: release-artifacts/*.tgz
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workers-npm-package
          path: release-artifacts
      - name: Verify reviewed archive bytes
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          shopt -s nullglob
          archives=(release-artifacts/*.tgz)
          test "${#archives[@]}" -eq 1
          test "$(sha256sum "${archives[0]}" | cut -d ' ' -f1)" = "$EXPECTED_SHA256"
      - name: Publish verified artifact
        run: npm publish ./release-artifacts/*.tgz --access public --provenance
