[package]
name = "lenso-web-greetings-app-example"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "greetings-web"
path = "src/main.rs"

[dependencies]
anyhow = "1"
lenso-engine-authoring = { path = "../../crates/lenso-engine-authoring", version = "0.3.1" }
lenso-web-greetings-plugin-example = { path = "../greetings-http-plugin" }
lenso-web-host = { path = "../../crates/lenso-web-host" }
rustix = { version = "1.1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
