[package]
name = "lenso-onboarding-todo-http"
version = "0.1.0"
edition.workspace = true
publish = false

[package.metadata.lenso]
plugin-id = "example.todo-http"
root-slot = "web"

[[bin]]
name = "lenso-onboarding-todo-http"
path = "src/main.rs"

[dependencies]
lenso.workspace = true
lenso-capability-http-endpoint = { path = "../../../crates/lenso-capability-http-endpoint", version = "0.3.8" }
lenso-web-host = { path = "../../../crates/lenso-web-host", version = "0.2.6" }
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal"] }

[lints]
workspace = true
